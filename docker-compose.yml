services:
  # ── 백엔드 (Spring Boot) ──
  backend:
    image: ${BACKEND_IMAGE:-ncafe-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${USER_ID:-newnaeun}-ncafe-backend
    # BFF 패턴: 백엔드는 외부 공개 불필요 (프론트엔드가 내부 네트워크로 접근)
    # 다만 Nginx 라우팅 등 기존 인프라와 호환을 위해 8032 포트를 열어둡니다.
    # ports:
    #   - "8032:8032"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/ncafedb}
      - JWT_SECRET=${JWT_SECRET}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - /home/${USER_ID:-newnaeun}/dist/ncafe/upload:/app/upload
    restart: unless-stopped
    depends_on:
      - db

  # ── 프론트엔드 (Next.js) ──
  frontend:
    image: ${FRONTEND_IMAGE:-ncafe-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${USER_ID:-newnaeun}-ncafe-frontend
    ports:
      - "${FRONTEND_PORT:-3032}:3032"
    environment:
      # 프론트엔드 BFF 프록시가 백엔드에 접속할 때 사용하는 환경변수 (Docker 내부 네트워크)
      - API_BASE_URL=http://backend:8032
      # iron-session 암호화 키 (32자 이상, GitHub Secrets에서 주입)
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - backend
    restart: unless-stopped

  # ── 데이터베이스 (PostgreSQL) ──
  db:
    image: postgres:17
    profiles: [ "with-db" ]
    container_name: ${USER_ID:-newnaeun}-ncafe-db
    environment:
      POSTGRES_DB: ncafedb
      POSTGRES_USER: ncafe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    # DB는 외부 공개 불필요 (백엔드만 내부 네트워크로 접근)
    # 로컬에서 포트 노출이 필요하면 docker-compose.override.yml을 사용하세요.
    volumes:
      - ncafe-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ncafe-db-data:
