<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고라파덕 카페 AI 에이전트 MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #FFF8E1 0%, #FFF3E0 100%);
            min-height: 100vh;
        }

        /* ===== 3.1 컬러 변수 (Design System) ===== */
        :root {
            --color-main: #F8D030;
            /* 파덕 옐로우 */
            --color-main-dark: #E5BF2A;
            /* 호버용 옐로우 */
            --color-accent: #5A3D2B;
            /* 다크 브라운 */
            --color-accent-light: #7B5B47;
            /* 라이트 브라운 */
            --color-bg-chat: #FFFDF7;
            /* 크림 라이트 베이지 */
            --color-white: #FFFFFF;
            --color-gray-light: #F0EDE8;
            --color-gray-text: #888888;
            --shadow-sm: 0 2px 8px rgba(90, 61, 43, 0.08);
            --shadow-md: 0 8px 24px rgba(90, 61, 43, 0.12);
            --shadow-lg: 0 12px 32px rgba(90, 61, 43, 0.18);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-full: 50%;
        }

        /* ===== 안내 페이지 ===== */
        .landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .landing-duck {
            font-size: 80px;
            margin-bottom: 16px;
            animation: duck-bounce 2s ease-in-out infinite;
        }

        @keyframes duck-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        .landing h1 {
            color: var(--color-accent);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .landing p {
            color: var(--color-accent-light);
            font-size: 1rem;
            line-height: 1.6;
        }

        .landing .keywords {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .landing .keyword-chip {
            background: var(--color-white);
            color: var(--color-accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-gray-light);
        }

        /* ===== Floating Action Button (FAB) ===== */
        .duck-fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--color-main) 0%, #FFE066 100%);
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-md);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
            border: 3px solid rgba(255, 255, 255, 0.6);
        }

        .duck-fab:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-lg);
        }

        .duck-fab:active {
            transform: scale(0.95);
        }

        .duck-fab .fab-icon {
            font-size: 32px;
            line-height: 1;
            transition: transform 0.3s;
        }

        .duck-fab.active .fab-icon {
            transform: rotate(90deg);
        }

        /* ===== Chat Panel ===== */
        .chat-panel {
            position: fixed;
            bottom: 104px;
            right: 28px;
            width: 380px;
            height: 540px;
            background: var(--color-white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;

            /* 닫힌 상태 */
            transform: translateY(24px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.25s ease;
        }

        .chat-panel.open {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== Chat Header ===== */
        .chat-header {
            background: linear-gradient(135deg, var(--color-main) 0%, #FFE066 100%);
            color: var(--color-accent);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            background: var(--color-white);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: var(--shadow-sm);
        }

        .chat-header-text h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .chat-header-text span {
            font-size: 0.75rem;
            color: var(--color-accent-light);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.4);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            font-size: 18px;
            color: var(--color-accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        /* ===== Chat Body ===== */
        .chat-body {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            background: var(--color-bg-chat);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-body::-webkit-scrollbar {
            width: 4px;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(90, 61, 43, 0.15);
            border-radius: 4px;
        }

        /* ===== Message Bubbles ===== */
        .message-row {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: msg-appear 0.3s ease-out;
        }

        @keyframes msg-appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-row.bot {
            align-self: flex-start;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background: var(--color-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .message-row.user .msg-avatar {
            background: var(--color-accent);
            color: var(--color-white);
            font-size: 12px;
        }

        .msg-bubble {
            padding: 12px 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-row.bot .msg-bubble {
            background: var(--color-white);
            color: #333;
            border-radius: 4px var(--radius-sm) var(--radius-sm) var(--radius-sm);
            box-shadow: var(--shadow-sm);
        }

        .message-row.user .msg-bubble {
            background: var(--color-accent);
            color: var(--color-white);
            border-radius: var(--radius-sm) 4px var(--radius-sm) var(--radius-sm);
        }

        /* ===== Typing Indicator ===== */
        .typing-row {
            display: none;
            align-self: flex-start;
            gap: 8px;
            max-width: 85%;
        }

        .typing-row.active {
            display: flex;
        }

        .typing-dots {
            background: var(--color-white);
            border-radius: 4px var(--radius-sm) var(--radius-sm) var(--radius-sm);
            box-shadow: var(--shadow-sm);
            padding: 14px 18px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--color-accent-light);
            border-radius: var(--radius-full);
            animation: dot-bounce 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot-bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ===== Quick Replies (빠른 답변 칩) ===== */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-self: flex-start;
            padding-left: 40px;
            animation: msg-appear 0.3s ease-out;
        }

        .quick-chip {
            background: var(--color-white);
            color: var(--color-accent);
            border: 1.5px solid var(--color-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-chip:hover {
            background: var(--color-main);
            color: var(--color-accent);
        }

        /* ===== Chat Input ===== */
        .chat-input-area {
            display: flex;
            padding: 12px 16px;
            background: var(--color-white);
            border-top: 1px solid var(--color-gray-light);
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid var(--color-gray-light);
            border-radius: var(--radius-lg);
            outline: none;
            font-size: 0.9rem;
            font-family: inherit;
            color: #333;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--color-main);
        }

        .chat-input-area input::placeholder {
            color: #bbb;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--color-main) 0%, var(--color-main-dark) 100%);
            color: var(--color-accent);
            border: none;
            border-radius: var(--radius-lg);
            padding: 0 18px;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 2px 6px rgba(248, 208, 48, 0.4);
        }

        .send-btn:active {
            transform: scale(0.97);
        }

        /* ===== 모바일 반응형 ===== */
        @media (max-width: 480px) {
            .chat-panel {
                width: calc(100vw - 24px);
                height: calc(100vh - 140px);
                right: 12px;
                bottom: 90px;
                border-radius: var(--radius-sm);
            }

            .duck-fab {
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 안내 페이지 ===== -->
    <div class="landing">
        <div class="landing-duck">🦆</div>
        <h1>고라파덕 카페 AI 에이전트</h1>
        <p>우측 하단의 파덕이를 클릭해서 대화를 시작해보세요!</p>
        <div class="keywords">
            <span class="keyword-chip">안녕</span>
            <span class="keyword-chip">달달한 거 추천해줘</span>
            <span class="keyword-chip">상큼한 거</span>
            <span class="keyword-chip">메뉴 보여줘</span>
            <span class="keyword-chip">고라파덕 라떼 하나 줘</span>
        </div>
    </div>

    <!-- ===== Chat Panel ===== -->
    <div class="chat-panel" id="chatPanel">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-header-avatar">🦆</div>
                <div class="chat-header-text">
                    <h3>파덕이</h3>
                    <span>고라파덕 카페 AI 에이전트</span>
                </div>
            </div>
            <button class="close-btn" id="closeBtn">✕</button>
        </div>

        <!-- Body -->
        <div class="chat-body" id="chatBody">
            <!-- 타이핑 인디케이터 (항상 하단에 위치) -->
            <div class="typing-row" id="typingRow">
                <div class="msg-avatar">🦆</div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="파덕이에게 물어보세요..." autocomplete="off">
            <button class="send-btn" id="sendBtn">전송</button>
        </div>
    </div>

    <!-- ===== FAB (Floating Action Button) ===== -->
    <div class="duck-fab" id="fabBtn">
        <span class="fab-icon">🦆</span>
    </div>

    <script>
        // =========================================
        // ===== Step 1: 더미 데이터 (메뉴) =====
        // =========================================
        const DUMMY_MENUS = [
            { id: 1, name: '고라파덕 라떼', price: 5500, category: 'signature', desc: '달콤한 바나나 크림이 올라간 옐로우 시그니처 라떼' },
            { id: 2, name: '자몽 에이드', price: 6000, category: 'ade', desc: '과즙 팡팡! 상큼하고 톡 쏘는 생자몽 에이드' },
            { id: 3, name: '레몬 에이드', price: 5500, category: 'ade', desc: '새콤 달콤한 레몬이 톡! 여름에 딱인 에이드' },
            { id: 4, name: '초코 케이크', price: 6500, category: 'dessert', desc: '스트레스를 날려줄 진하고 꾸덕한 초콜릿 케이크' },
            { id: 5, name: '아메리카노', price: 4000, category: 'coffee', desc: '깔끔한 산미가 매력적인 클래식 아메리카노' },
            { id: 6, name: '카페 모카', price: 5000, category: 'coffee', desc: '초코와 에스프레소의 달콤 쌉싸름 조합' },
            { id: 7, name: '바닐라 빈 라떼', price: 5500, category: 'coffee', desc: '진짜 바닐라 빈이 들어간 고급 라떼' },
            { id: 8, name: '크로플', price: 4500, category: 'dessert', desc: '바삭 쫀득한 크로플에 아이스크림을 한 스쿱!' },
        ];

        // =========================================
        // ===== Step 2: DOM 요소 & 상태 관리 =====
        // =========================================
        const fabBtn = document.getElementById('fabBtn');
        const closeBtn = document.getElementById('closeBtn');
        const chatPanel = document.getElementById('chatPanel');
        const chatBody = document.getElementById('chatBody');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingRow = document.getElementById('typingRow');

        let isOpen = false;
        let isFirstOpen = true;

        // ===== 채팅창 Open / Close =====
        const toggleChat = () => {
            isOpen = !isOpen;
            chatPanel.classList.toggle('open', isOpen);
            fabBtn.classList.toggle('active', isOpen);

            if (isOpen) {
                chatInput.focus();
                // 처음 열었을 때만 환영 메시지 + 빠른 답변
                if (isFirstOpen) {
                    isFirstOpen = false;
                    addBotMessage('쿠웨에엑! 고라파덕 카페에 온 걸 환영한다덕! 🎉\n무엇을 도와줄까덕?');
                    setTimeout(() => {
                        addQuickReplies(['메뉴 보여줘', '추천해줘', '디저트 뭐 있어?']);
                    }, 400);
                }
            }
        };

        fabBtn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', toggleChat);

        // =========================================
        // ===== Step 3: 채팅 UI 로직 =====
        // =========================================

        // 메시지 추가 (공통)
        const addMessage = (text, sender) => {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = sender === 'bot' ? '🦆' : '🧑';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = text;

            row.appendChild(avatar);
            row.appendChild(bubble);

            // 타이핑 인디케이터 바로 위에 삽입
            chatBody.insertBefore(row, typingRow);
            scrollToBottom();
        };

        const addBotMessage = (text) => addMessage(text, 'bot');
        const addUserMessage = (text) => addMessage(text, 'user');

        // 빠른 답변 칩 추가
        const addQuickReplies = (options) => {
            const container = document.createElement('div');
            container.className = 'quick-replies';

            options.forEach(opt => {
                const chip = document.createElement('button');
                chip.className = 'quick-chip';
                chip.textContent = opt;
                chip.addEventListener('click', () => {
                    container.remove(); // 칩 제거
                    handleUserInput(opt);
                });
                container.appendChild(chip);
            });

            chatBody.insertBefore(container, typingRow);
            scrollToBottom();
        };

        const scrollToBottom = () => {
            chatBody.scrollTop = chatBody.scrollHeight;
        };

        // =========================================
        // ===== Step 4: 키워드 매칭 응답 엔진 =====
        // =========================================
        const generateBotResponse = (userText) => {
            const t = userText.toLowerCase().replace(/\s/g, '');

            // 1. 인사
            if (/안녕|하이|반가|헬로|hello|hi/.test(t)) {
                return {
                    text: '쿠웨에엑! 반갑다덕! 🎉 뭘 도와줄까덕?',
                    quickReplies: ['메뉴 보여줘', '추천해줘', '주문할래']
                };
            }

            // 2. 메뉴 목록 요청
            if (/메뉴|목록|뭐있|뭐팔|리스트/.test(t)) {
                const menuList = DUMMY_MENUS.map(m => `• ${m.name} — ${m.price.toLocaleString()}원`).join('\n');
                return {
                    text: `파덕! 우리 카페 메뉴 전부 보여줄게덕!\n\n${menuList}\n\n어떤 거 마셔볼래덕?`,
                    quickReplies: ['추천해줘', '달달한 거', '상큼한 거']
                };
            }

            // 3. 상큼/시원 추천
            if (/상큼|시원|에이드|청량|톡/.test(t)) {
                const ades = DUMMY_MENUS.filter(m => m.category === 'ade');
                const rec = ades[Math.floor(Math.random() * ades.length)];
                return {
                    text: `쿠웨엑! 상큼한 거라면 「${rec.name}」(${rec.price.toLocaleString()}원)이 최고다덕! 🍋\n${rec.desc}덕!`,
                    quickReplies: [`${rec.name} 주문할래`, '다른 추천해줘']
                };
            }

            // 4. 달달/시그니처 추천
            if (/달콤|달달|따뜻|시그니처|라떼|추천/.test(t)) {
                const sig = DUMMY_MENUS.find(m => m.category === 'signature');
                return {
                    text: `파덕! 달달한 거라면 우리 시그니처 「${sig.name}」(${sig.price.toLocaleString()}원)을 강력 추천한다덕! ☕\n${sig.desc}덕!`,
                    quickReplies: [`${sig.name} 주문할래`, '다른 추천해줘', '메뉴 보여줘']
                };
            }

            // 5. 디저트 추천
            if (/디저트|케이크|빵|크로플|간식|달거/.test(t)) {
                const desserts = DUMMY_MENUS.filter(m => m.category === 'dessert');
                const list = desserts.map(d => `• ${d.name} — ${d.price.toLocaleString()}원`).join('\n');
                return {
                    text: `파덕! 우리 디저트 메뉴다덕! 🍰\n\n${list}\n\n뭘 먹어볼래덕?`,
                    quickReplies: desserts.map(d => `${d.name} 줘`)
                };
            }

            // 6. 커피
            if (/커피|아메|모카|카페/.test(t)) {
                const coffees = DUMMY_MENUS.filter(m => m.category === 'coffee');
                const list = coffees.map(c => `• ${c.name} — ${c.price.toLocaleString()}원`).join('\n');
                return {
                    text: `파덕! 커피 메뉴다덕! ☕\n\n${list}\n\n어떤 걸로 골라볼래덕?`,
                    quickReplies: coffees.map(c => `${c.name} 한 잔`)
                };
            }

            // 7. 주문 확인
            if (/줘|주문|콜|담아|할래|한잔|하나/.test(t)) {
                // 메뉴명이 포함되어 있는지 확인
                const matchedMenu = DUMMY_MENUS.find(m => t.includes(m.name.replace(/\s/g, '').toLowerCase()));
                if (matchedMenu) {
                    return {
                        text: `「${matchedMenu.name}」 주문서에 담았다덕! 📝\n💰 ${matchedMenu.price.toLocaleString()}원이다덕!\n카운터에서 확인해달라덕!`,
                        quickReplies: ['더 주문할래', '메뉴 보여줘']
                    };
                }
                return {
                    text: '주문서에 담았다덕! 📝 카운터에서 확인해달라덕!',
                    quickReplies: ['더 주문할래', '메뉴 보여줘']
                };
            }

            // 8. 가격 문의
            if (/가격|얼마/.test(t)) {
                const matchedMenu = DUMMY_MENUS.find(m => t.includes(m.name.replace(/\s/g, '').toLowerCase()));
                if (matchedMenu) {
                    return {
                        text: `「${matchedMenu.name}」은(는) ${matchedMenu.price.toLocaleString()}원이다덕! 💰`,
                        quickReplies: [`${matchedMenu.name} 주문할래`, '메뉴 보여줘']
                    };
                }
                return {
                    text: '어떤 메뉴의 가격이 궁금하냐덕? 메뉴 이름을 말해달라덕!',
                    quickReplies: ['메뉴 보여줘']
                };
            }

            // Fallback
            return {
                text: '파...덕? 🤔 무슨 말인지 잘 모르겠다덕!\n메뉴를 추천받거나 주문해보라덕!',
                quickReplies: ['메뉴 보여줘', '추천해줘', '주문할래']
            };
        };

        // =========================================
        // ===== 사용자 입력 처리 핸들러 =====
        // =========================================
        const handleUserInput = (text) => {
            if (!text.trim()) return;

            // 사용자 메시지 표시
            addUserMessage(text);
            chatInput.value = '';

            // 타이핑 인디케이터 표시
            typingRow.classList.add('active');
            scrollToBottom();

            // 봇 응답 시뮬레이션 (0.8 ~ 1.5초 딜레이)
            const delay = 800 + Math.random() * 700;
            setTimeout(() => {
                typingRow.classList.remove('active');
                const response = generateBotResponse(text);
                addBotMessage(response.text);

                // 빠른 답변 칩이 있으면 300ms 후 표시
                if (response.quickReplies && response.quickReplies.length > 0) {
                    setTimeout(() => {
                        addQuickReplies(response.quickReplies);
                    }, 300);
                }
            }, delay);
        };

        // 이벤트 바인딩
        sendBtn.addEventListener('click', () => handleUserInput(chatInput.value));
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserInput(chatInput.value);
        });
    </script>
</body>

</html>
