# 워크플로우 이름: GitHub Actions 탭에서 표시될 이름
name: Deploy

# 트리거 설정: master 브랜치에 push될 때 + 수동 실행(workflow_dispatch) 가능
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    # 실행 환경: 서버에 직접 설치한 Self-hosted Runner에서 실행
    runs-on: self-hosted
    steps:
      # 단계 1: GitHub 저장소의 최신 코드를 서버의 Runner 작업 디렉토리로 내려받음
      - name: Checkout
        uses: actions/checkout@v4

      # 단계 2: GitHub Secrets에서 값을 꺼내 서버에 .env 파일 생성
      # 서버에는 .env가 없으므로(.gitignore로 제외됨) 여기서 직접 만들어줌
      - name: Create .env file
        run: |
          echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" > .env
          echo "USER_ID=${USER_ID}" >> .env
          echo "FRONTEND_PORT=${FRONTEND_PORT}" >> .env
          echo "SESSION_SECRET=${SESSION_SECRET}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
          echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}" >> .env
        env:
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          USER_ID: ${{ vars.USER_ID }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}

      # 단계 3: 기존 컨테이너 정리 (이름 충돌 방지)
      - name: Stop old containers
        run: |
          docker compose --profile with-db down --remove-orphans || true
          # 이전 배포에서 남은 컨테이너가 있으면 강제 삭제
          docker rm -f ${USER_ID}-ncafe-backend ${USER_ID}-ncafe-frontend ${USER_ID}-ncafe-db 2>/dev/null || true
        env:
          USER_ID: ${{ vars.USER_ID }}

      # 단계 4: Docker Compose로 빌드 및 실행
      - name: Build and Deploy
        run: docker compose --profile with-db up --build -d

      # 단계 4: 배포 결과 확인 (컨테이너 상태 + 헬스체크)
      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker compose --profile with-db ps
          sleep 15
          echo ""
          echo "=== Health Check ==="
          # 프론트엔드: 외부 포트로 확인
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3032} || echo "Frontend : not responding"
          # 백엔드: 외부 포트가 없으므로 Docker 내부에서 확인
          docker compose --profile with-db exec -T backend curl -sf --max-time 10 -o /dev/null -w "Backend  : HTTP %{http_code}\n" http://localhost:8032 || echo "Backend  : not responding"
        env:
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      # 단계 5: 사용하지 않는 이전 Docker 이미지 정리
      - name: Clean up old images
        run: docker image prune -f
