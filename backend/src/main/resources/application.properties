spring.application.name=backend
server.port=8032

# DataSource Configuration
# 로컬 개발: localhost:5332 / Docker 배포: db:5432
# spring.datasource.url=jdbc:postgresql://localhost:5332/ncafedb?useSSL=false&allowPublicKeyRetrieval=true
# Docker 배포: 아래 내용으로 교체하세요
spring.datasource.url=jdbc:postgresql://db:5432/ncafedb?useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.url=jdbc:postgresql://localhost:5332/ncafedb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=ncafe
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# 브라우저에서 사용할 URL 패턴 (사용자가 요청할 때 사용되는 요청)
# upload 파일에서 images로 시작하는 요청으로 부른다
# localhost:8080/aa/latte.png
# aa로 요청한 파일은 ./upload/images/menus/에서 찾는다
# spring.mvc.static-path-pattern=/aa/**
# spring.mvc.static-path-pattern=/**
# 모든 요청이 아닌 /images/로 시작하는 요청만 정적 리소스로 처리
spring.mvc.static-path-pattern=/images/**

# 실제 이미지가 저장된 물리적 경로 (마지막에 / 필수)
# 설정하지 않는다면 다음줄이 기본 설정
# spring.web.resources.static-locations=file:classpath:/static/
# 밑에 처럼 쓰면 처음에 images/menus에서 찾고 없으면 static에서 찾는다
# spring.web.resources.static-locations=file:./upload/images/menus/, classpath:/static/
spring.web.resources.static-locations=file:./upload/images/menus

# JPA Configuration
spring.jpa.show-sql=true
# update: 변경사항이 있으면 테이블 자동 업데이트
# create: 실행할 때마다 테이블 삭제 후 재생성
# create-drop: 실행 후 테이블 삭제
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



