spring.datasource.driver-class-name=org.postgresql.Driver

# 브라우저에서 사용할 URL 패턴 (사용자가 요청할 때 사용되는 요청)
# upload 파일에서 images로 시작하는 요청으로 부른다
# localhost:8080/aa/latte.png
# aa로 요청한 파일은 ./upload/images/menus/에서 찾는다
# spring.mvc.static-path-pattern=/aa/**
spring.mvc.static-path-pattern=/**

# 실제 이미지가 저장된 물리적 경로 (마지막에 / 필수)
# 설정하지 않는다면 다음줄이 기본 설정
# spring.web.resources.static-locations=file:classpath:/static/
# 밑에 처럼 쓰면 처음에 images/menus에서 찾고 없으면 static에서 찾는다
# spring.web.resources.static-locations=file:./upload/images/menus/, classpath:/static/
spring.web.resources.static-locations=file:./upload/images/menus


