spring.application.name=backend
server.port=8032

# DataSource Configuration
# DataSource Configuration
# 로컬 개발: 기본값인 localhost:5332 포트를 사용합니다.
# Docker 배포: docker-compose 환경 변수(SPRING_DATASOURCE_URL)를 통해 db:5432를 자동으로 주입받습니다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/ncafedb?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=ncafe
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 브라우저에서 사용할 URL 패턴 (사용자가 요청할 때 사용되는 요청)
# upload 파일에서 images로 시작하는 요청으로 부른다
# localhost:8080/aa/latte.png
# aa로 요청한 파일은 ./upload/images/menus/에서 찾는다
# spring.mvc.static-path-pattern=/aa/**
spring.mvc.static-path-pattern=/**

# 실제 이미지가 저장된 물리적 경로 (마지막에 / 필수)
# 설정하지 않는다면 다음줄이 기본 설정
# spring.web.resources.static-locations=file:classpath:/static/
# 밑에 처럼 쓰면 처음에 images/menus에서 찾고 없으면 static에서 찾는다
# spring.web.resources.static-locations=file:./upload/images/menus/, classpath:/static/
spring.web.resources.static-locations=file:./upload/images

# JPA Configuration
spring.jpa.show-sql=true
# update: 변경사항이 있으면 테이블 자동 업데이트
# create: 실행할 때마다 테이블 삭제 후 재생성
# create-drop: 실행 후 테이블 삭제
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# 시크릿 키는 환경변수(JWT_SECRET)로 관리합니다.
# 로컬: .env 파일에서 주입 / 서버: docker-compose → GitHub Secrets에서 주입
jwt.secret=${JWT_SECRET:default-jwt-secret-for-local-dev-only}
# Access Token 유효기간 (밀리초) - 15분
jwt.access-expiration=900000
