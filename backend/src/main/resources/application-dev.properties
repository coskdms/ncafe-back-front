# [DEV] Local Development Configuration
# 로컬 개발 시에는 SQL 로그를 상세히 보고, 로컬 DB에 접속합니다.

# DB 접속 정보 (로컬에서 직접 실행할 때 사용)
# Docker 환경에서는 docker-compose가 .env에서 값을 주입하므로 여기 설정은 무시됩니다.
spring.datasource.url=jdbc:postgresql://localhost:5332/ncafedb
spring.datasource.username=ncafe
spring.datasource.password=1234

# JPA 로그 상세 출력
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# p6spy SQL 실행 시간 측정 (true = 활성화, false = 비활성화)
p6spy.enabled=false