# p6spy - SQL 실행 시간 측정 설정

# 실제 PostgreSQL 드라이버 지정
driverlist=org.postgresql.Driver

# Slf4J로 출력
appender=com.p6spy.engine.spy.appender.FileLogger
logfile=/tmp/p6spy.log

# 실행 시간(ms) | 카테고리 | 파라미터가 바인딩된 실제 SQL 출력
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=[p6spy] %(executionTime)ms | %(category) | %(sql)

# 슬로우 쿼리 기준: 100ms 이상
# 0 = 모든 쿼리 기록 / 100 = 100ms 이상만 기록 (슬로우 쿼리 감지용)
executionThreshold=0

# 빈 SQL 제외
filter=true
excludecategories=info,debug,result,resultset