# p6spy - SQL 실행 시간 측정 설정

# Slf4J로 출력 (Spring 로그 레벨 설정과 연동)
appender=com.p6spy.engine.spy.appender.Slf4JLogger
slf4jLogLevel=INFO

# 실행 시간(ms) | 카테고리 | 파라미터가 바인딩된 실제 SQL 출력
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=[p6spy] %(executionTime)ms | %(category) | %(sql)

# 슬로우 쿼리 기준: 100ms 이상이면 WARN으로 별도 출력
executionThreshold=100

# 빈 SQL 제외
filter=true
excludecategories=info,debug,result,resultset