<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>쿠키쿠키 Test</h1>
    <p th:text="${name}"></p>
    <p th:text="${age}"></p>
    <p th:text="${sessionName}"></p>
    <p th:text="${sessionAge}"></p>
    <a href="/cookie/create">쿠키 생성</a>
    <a href="/cookie/delete">쿠키 삭제</a>
    <!-- 귀찮아서 쿠키랑 같이 만든다 -->
    <a href="/cookie/session/create">세션 생성</a>
    <!-- ====== 추가된 부분: 로그인 인증 정보 출력 ====== -->
    <div style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; background-color: #f9f9f9;"
        th:if="${securityUsername != null}">
        <h3>🔐 로그인 인증 정보 (Spring Security)</h3>
        <p><strong>아이디:</strong> <span th:text="${securityUsername}"></span></p>
        <p><strong>보유 권한:</strong> <span th:text="${securityAuthorities}"></span></p>
    </div>
</body>

</html>
